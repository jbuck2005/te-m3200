# Copy to secrets.yaml (git-ignored) and fill in.
# Each value here is used in the YAML configs as !secret <name>.
wifi_ssid: "your-ssid"                                                          # your WiFi network name
wifi_password: "your-wifi-password"                                             # your WiFi password
ap_password: "fallback-hotspot-password"                                       # fallback hotspot only (min 8 chars) - don't reuse wifi_password,
                                                                                # or anyone given the hotspot password learns your WiFi password

# Generate with: openssl rand -base64 32. Secures both the HA API and OTA uploads.
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY_AAAAAAAAAAA="

mqtt_broker: "192.168.1.10"                                                     # IP address or hostname of your MQTT broker
mqtt_username: "esphome"                                                        # MQTT login
mqtt_password: "mqtt-password"
